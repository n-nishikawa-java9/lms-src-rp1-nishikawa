<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワードを忘れた方 | LMS</title>

  <link rel="stylesheet" type="text/css" href="./../../css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="./../../css/dataTables.bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="./../../css/bootstrap-datepicker.min.css">
  <link rel="stylesheet" type="text/css" href="./../../css/lms.css">
  <link rel="shortcut icon" href="./../../img/favicon.ico">

  <script type="text/javascript" src="./../../js/jquery.2.1.1.min.js"></script>
  <script type="text/javascript" src="./../../js/jquery.dataTables.min.js"></script>
  <script type="text/javascript" src="./../../js/dataTables.bootstrap.min.js"></script>
  <script type="text/javascript" src="./../../js/bootstrap-datepicker.min.js"></script>
  <script type="text/javascript" src="./../../js/bootstrap-datepicker.ja.min.js"></script>
  <script type="text/javascript" src="./../../js/lms_common.js"></script>
  <script type="text/javascript" src="./../../js/bootstrap.min.js"></script>

</head>

<body>
  <div id="header">
    <nav class="navbar navbar-default">
      <div class="container">
        <div class="navbar-header">
          <a href="../course/list.html" class="navbar-brand">LMS 学習管理システム</a>
        </div>
      </div>
    </nav>
  </div>

  <div id="wrap">
    <div class="container">

      <div id="contents" class="clearfix">
        <div id="main" class="main2clm">
          <h2>パスワード再設定</h2>
          <div class="well bs-component">
            企業担当者の方： <br />
            エントリー時にご登録頂いたメールアドレスをご入力して頂きますと、5分～10分後に パスワード再設定についてのメールを送付致します。<br /><br />
            育成担当者の方： <br />
            ご本人がパスワードを再設定することはできませんので、お手数ですが東京ITスクール事務局に再発行を依頼するようお願い致します。 <br /><br />
            受講生の方： <br />
            ご本人がパスワードを再設定することはできませんので、お手数ですが講師に再発行を依頼するようお願い致します。 <br /><br />
            <form class="form-horizontal" action="./complete.html">
              <fieldset>
                <div class="form-group">
                  <label for="mailAddress" class="col-lg-2 control-label">メールアドレス</label>
                  <div class="col-lg-10">
                    <input type="email" class="form-control" />
                  </div>
                </div>

                <div class="form-group">
                  <html:errors property="token" />
                  <div class="col-lg-10 col-lg-offset-2">
                    <input type="button" class="btn btn-primary" onclick="history.back();" value="戻る" />
                    <input type="submit" class="btn btn-primary" onclick="return sendCheck();" value="送信" />
                  </div>
                </div>
              </fieldset>
              </s:form>
          </div>

        </div>
      </div>
      
      <div id="push"></div>
    </div>
  </div>
  <div id="footer">
    <div class="container">
      <p class="muted credit">Copyright(C) 2015 System Shared co., ltd, ALL Rights Reserved</p>
    </div>
  </div>

  <script>
    function sendCheck() {
      if (confirm("送信します。よろしいですか？")) {
        return true;
      }
      else {
        return false;
      }
    }
  </script>
</body>

</html>
